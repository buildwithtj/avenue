- tm_checklist:
    Control: Timer
    Properties:
      Duration: =420
      AutoStart: =true
      Repeat: =false
      Visible: =false
      X: =0
      Y: =28
      Width: =10
      Height: =10
- sc_checklist:
    Control: GroupContainer@1.3.0
    Variant: AutoLayout
    Properties:
      X: =0
      Y: =88
      Width: =App.Width
      Height: =App.Height - 88
      Fill: =RGBA(0, 0, 0, 0)
      PaddingTop: =Round((1 - Min(1, tm_checklist.Value / 420)) * 22, 0)
      LayoutAlignItems: =LayoutAlignItems.Center
      LayoutDirection: =LayoutDirection.Vertical
      LayoutOverflowY: =LayoutOverflow.Scroll
      DropShadow: =DropShadow.None
    Children:
    - pg_checklist:
        Control: GroupContainer@1.3.0
        Variant: ManualLayout
        Properties:
          Height: =717
          Width: =1366
          AlignInContainer: =AlignInContainer.Center
          FillPortions: =0
          Fill: =RGBA(0, 0, 0, 0)
          DropShadow: =DropShadow.None
        Children:
        - qHelp:
            Control: Label
            Properties:
              Text: ="Flavors' own entry and exit checklist questions (Q-10). Members answer Yes or No to each."
              X: =20
              Y: =0
              Width: =1300
              Height: =30
              Color: =RGBA(96,94,92,1)
              Size: =12
        - qKind:
            Control: Classic/DropDown
            Properties:
              Items: =["Entry", "Exit"]
              Default: ="Entry"
              X: =20
              Y: =40
              Width: =160
              Height: =36
              BorderColor: =RGBA(225,228,233,1)
              BorderThickness: =1
              Color: =RGBA(31,31,31,1)
              Fill: =RGBA(255,255,255,1)
        - qText:
            Control: Classic/TextInput
            Properties:
              Default: =""
              HintText: ="Question"
              X: =190
              Y: =40
              Width: =700
              Height: =36
              BorderColor: =RGBA(225,228,233,1)
              BorderThickness: =1
              Color: =RGBA(31,31,31,1)
              Fill: =RGBA(255,255,255,1)
        - qOrder:
            Control: Classic/TextInput
            Properties:
              Default: ="1"
              HintText: ="Order"
              Format: =TextFormat.Number
              X: =900
              Y: =40
              Width: =90
              Height: =36
              BorderColor: =RGBA(225,228,233,1)
              BorderThickness: =1
              Color: =RGBA(31,31,31,1)
              Fill: =RGBA(255,255,255,1)
        - qAdd:
            Control: Classic/Button
            Properties:
              Text: ="Add question"
              X: =1000
              Y: =40
              Width: =180
              Height: =36
              OnSelect: |-
                =If(IsBlank(Trim(qText.Text)), Notify("Enter the question.", NotificationType.Warning), Patch(AvenueChecklistQuestions, Defaults(AvenueChecklistQuestions), {Title: Left(Trim(qText.Text), 255), FacilityId: "flavors-hyattsville", Kind: {Value: qKind.Selected.Value}, Question: Trim(qText.Text), SortOrder: Value(qOrder.Text), Active: true}); Reset(qText); Notify("Question added.", NotificationType.Success))
              Fill: =RGBA(201,162,77,1)
              Color: =RGBA(31,31,31,1)
              HoverFill: =RGBA(179,141,60,1)
              HoverColor: =RGBA(31,31,31,1)
              PressedFill: =RGBA(179,141,60,1)
              DisabledFill: =RGBA(225,228,233,1)
              DisabledColor: =RGBA(91,99,112,1)
              BorderThickness: =0
              Size: =12
              FontWeight: =FontWeight.Semibold
              RadiusTopLeft: =8
              RadiusTopRight: =8
              RadiusBottomLeft: =8
              RadiusBottomRight: =8
        - qEntryHead:
            Control: Label
            Properties:
              Text: ="Entry checklist"
              X: =20
              Y: =90
              Width: =640
              Height: =30
              Color: =RGBA(31,31,31,1)
              FontWeight: =FontWeight.Semibold
        - qEntryList:
            Control: Gallery@2.15.0
            Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
            Properties:
              Items: =SortByColumns(Filter(AvenueChecklistQuestions, Active = true, Kind.Value = "Entry"), "SortOrder", SortOrder.Ascending)
              X: =20
              Y: =125
              Width: =640
              Height: =560
              TemplateSize: =56
              Fill: =RGBA(0,0,0,0)
              BorderThickness: =0
              TemplateFill: =If(ThisItem.IsSelected, RGBA(241,243,228,1), RGBA(0,0,0,0))
            Children:
              - qEntryItem:
                  Control: Label
                  Properties:
                    Text: =Text(ThisItem.SortOrder) & ". " & ThisItem.Question
                    X: =8
                    Y: =6
                    Width: =480
                    Height: =44
                    Color: =RGBA(31,31,31,1)
              - qEntryRemove:
                  Control: Classic/Button
                  Properties:
                    Text: ="Remove"
                    X: =500
                    Y: =10
                    Width: =120
                    Height: =34
                    OnSelect: |-
                      =Patch(AvenueChecklistQuestions, ThisItem, {Active: false}); Notify("Question removed.", NotificationType.Information)
              - qEntryListSep:
                  Control: Label
                  Properties:
                    Text: =""
                    X: =8
                    Y: =55
                    Width: =608
                    Height: =1
                    Fill: =RGBA(225,228,233,1)
        - qExitHead:
            Control: Label
            Properties:
              Text: ="Exit checklist"
              X: =680
              Y: =90
              Width: =640
              Height: =30
              Color: =RGBA(31,31,31,1)
              FontWeight: =FontWeight.Semibold
        - qExitList:
            Control: Gallery@2.15.0
            Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
            Properties:
              Items: =SortByColumns(Filter(AvenueChecklistQuestions, Active = true, Kind.Value = "Exit"), "SortOrder", SortOrder.Ascending)
              X: =680
              Y: =125
              Width: =640
              Height: =560
              TemplateSize: =56
              Fill: =RGBA(0,0,0,0)
              BorderThickness: =0
              TemplateFill: =If(ThisItem.IsSelected, RGBA(241,243,228,1), RGBA(0,0,0,0))
            Children:
              - qExitItem:
                  Control: Label
                  Properties:
                    Text: =Text(ThisItem.SortOrder) & ". " & ThisItem.Question
                    X: =8
                    Y: =6
                    Width: =480
                    Height: =44
                    Color: =RGBA(31,31,31,1)
              - qExitRemove:
                  Control: Classic/Button
                  Properties:
                    Text: ="Remove"
                    X: =500
                    Y: =10
                    Width: =120
                    Height: =34
                    OnSelect: |-
                      =Patch(AvenueChecklistQuestions, ThisItem, {Active: false}); Notify("Question removed.", NotificationType.Information)
              - qExitListSep:
                  Control: Label
                  Properties:
                    Text: =""
                    X: =8
