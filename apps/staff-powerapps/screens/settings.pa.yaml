- tm_settings:
    Control: Timer
    Properties:
      Duration: =420
      AutoStart: =true
      Repeat: =false
      Visible: =false
      X: =0
      Y: =28
      Width: =10
      Height: =10
- sc_settings:
    Control: GroupContainer@1.3.0
    Variant: AutoLayout
    Properties:
      X: =0
      Y: =88
      Width: =App.Width
      Height: =App.Height - 88
      Fill: =RGBA(0, 0, 0, 0)
      PaddingTop: =Round((1 - Min(1, tm_settings.Value / 420)) * 22, 0)
      LayoutAlignItems: =LayoutAlignItems.Center
      LayoutDirection: =LayoutDirection.Vertical
      LayoutOverflowY: =LayoutOverflow.Scroll
      DropShadow: =DropShadow.None
    Children:
    - pg_settings:
        Control: GroupContainer@1.3.0
        Variant: ManualLayout
        Properties:
          Height: =680
          Width: =1366
          AlignInContainer: =AlignInContainer.Center
          FillPortions: =0
          Fill: =RGBA(0, 0, 0, 0)
          DropShadow: =DropShadow.None
        Children:
        - sHelp:
            Control: Label
            Properties:
              Text: ="Facility settings used by Avenue's automations. Defaults are proposals until Flavors confirms them (Q-10)."
              X: =20
              Y: =0
              Width: =1300
              Height: =30
              Color: =RGBA(96,94,92,1)
              Size: =12
        - sEntryLbl:
            Control: Label
            Properties:
              Text: ="Minutes after the start before a missing entry checklist is chased"
              X: =20
              Y: =40
              Width: =640
              Height: =24
              Color: =RGBA(31,31,31,1)
              Size: =12
        - sEntry:
            Control: Classic/TextInput
            Properties:
              Default: =Text(LookUp(AvenueFacilities, FacilityId = "flavors-hyattsville").EntryGraceMinutes)
              Format: =TextFormat.Number
              X: =20
              Y: =65
              Width: =160
              Height: =36
              BorderColor: =RGBA(225,228,233,1)
              BorderThickness: =1
              Color: =RGBA(31,31,31,1)
              Fill: =RGBA(255,255,255,1)
        - sExitLbl:
            Control: Label
            Properties:
              Text: ="Minutes after the end before a missing exit checklist is chased"
              X: =20
              Y: =110
              Width: =640
              Height: =24
              Color: =RGBA(31,31,31,1)
              Size: =12
        - sExit:
            Control: Classic/TextInput
            Properties:
              Default: =Text(LookUp(AvenueFacilities, FacilityId = "flavors-hyattsville").ExitGraceMinutes)
              Format: =TextFormat.Number
              X: =20
              Y: =135
              Width: =160
              Height: =36
              BorderColor: =RGBA(225,228,233,1)
              BorderThickness: =1
              Color: =RGBA(31,31,31,1)
              Fill: =RGBA(255,255,255,1)
        - sEmailLbl:
            Control: Label
            Properties:
              Text: ="Staff alert e-mail (new requests, failed and overdue checklists). Empty = no staff e-mails."
              X: =20
              Y: =180
              Width: =900
              Height: =24
              Color: =RGBA(31,31,31,1)
              Size: =12
        - sEmail:
            Control: Classic/TextInput
            Properties:
              Default: =LookUp(AvenueFacilities, FacilityId = "flavors-hyattsville").StaffAlertEmail
              HintText: ="management@example.com"
              X: =20
              Y: =205
              Width: =640
              Height: =36
              BorderColor: =RGBA(225,228,233,1)
              BorderThickness: =1
              Color: =RGBA(31,31,31,1)
              Fill: =RGBA(255,255,255,1)
        - sSave:
            Control: Classic/Button
            Properties:
              Text: ="Save settings"
              X: =20
              Y: =260
              Width: =200
              Height: =40
              OnSelect: |-
                =If(!(Value(sEntry.Text) >= 0 && Value(sEntry.Text) <= 240 && Value(sExit.Text) >= 0 && Value(sExit.Text) <= 240), Notify("Minutes must be between 0 and 240.", NotificationType.Warning), !IsBlank(Trim(sEmail.Text)) && !IsMatch(Trim(sEmail.Text), Match.Email), Notify("Enter a valid e-mail or leave it empty.", NotificationType.Warning), IfError(Patch(AvenueFacilities, LookUp(AvenueFacilities, FacilityId = "flavors-hyattsville"), {EntryGraceMinutes: Value(sEntry.Text), ExitGraceMinutes: Value(sExit.Text), StaffAlertEmail: Lower(Trim(sEmail.Text))}); Refresh(AvenueFacilities); Notify("Settings saved.", NotificationType.Success), Notify("Could not save the settings.", NotificationType.Error)))
              Fill: =RGBA(201,162,77,1)
              Color: =RGBA(31,31,31,1)
              HoverFill: =RGBA(179,141,60,1)
              HoverColor: =RGBA(31,31,31,1)
              PressedFill: =RGBA(179,141,60,1)
              DisabledFill: =RGBA(225,228,233,1)
              DisabledColor: =RGBA(91,99,112,1)
              BorderThickness: =0
              Size: =12
              FontWeight: =FontWeight.Semibold
              RadiusTopLeft: =8
              RadiusTopRight: =8
              RadiusBottomLeft: =8
              RadiusBottomRight: =8
