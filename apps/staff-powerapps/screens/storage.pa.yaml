              Y: =90
              Width: =640
              Height: =580
              TemplateSize: =66
              Fill: =RGBA(0,0,0,0)
              BorderThickness: =0
              TemplateFill: =If(ThisItem.IsSelected, RGBA(241,243,228,1), RGBA(0,0,0,0))
            Children:
              - stoItemTitle:
                  Control: Label
                  Properties:
                    Text: =ThisItem.Item.Value & " × " & Coalesce(Text(ThisItem.Quantity), "?")
