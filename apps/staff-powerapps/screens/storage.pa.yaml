                    Y: =20
                    Width: =128
                    Height: =24
                    DisplayMode: =DisplayMode.Disabled
                    Fill: =Switch(ThisItem.Status.Value, "Requested", RGBA(244,235,211,1), "Approved", RGBA(220,232,235,1), RGBA(229,231,235,1))
                    DisabledFill: =Switch(ThisItem.Status.Value, "Requested", RGBA(244,235,211,1), "Approved", RGBA(220,232,235,1), RGBA(229,231,235,1))
                    DisabledColor: =Switch(ThisItem.Status.Value, "Requested", RGBA(107,79,16,1), "Approved", RGBA(15,76,92,1), RGBA(91,99,112,1))
