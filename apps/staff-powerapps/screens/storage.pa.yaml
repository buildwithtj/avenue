              Height: =40
              OnSelect: |-
                =IfError(Patch(AvenueStorageCases, LookUp(AvenueStorageCases, CaseId = stoGal.Selected.CaseId), {Status: {Value: "Approved"}, MonthlyCents: Round(Value(stoAmt.Text) * 100, 0), DecidedBy: User().Email, DecidedAt: Now()}); Notify("Approved. Billing is done by hand.", NotificationType.Success), Notify("Could not save.", NotificationType.Error))
