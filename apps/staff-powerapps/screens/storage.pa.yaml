            Control: Gallery@2.15.0
            Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
            Properties:
              Items: |-
                =With({st: Coalesce(varStoStage, "All")}, SortByColumns(AddColumns(If(st = "All", Filter(AvenueStorageCases, FacilityId = "flavors-hyattsville"), Filter(AvenueStorageCases, FacilityId = "flavors-hyattsville", Status.Value = st)), Rank, Switch(Status.Value, "Requested", 0, "Approved", 1, 2)), "Rank", SortOrder.Ascending, "DecidedAt", SortOrder.Descending))
