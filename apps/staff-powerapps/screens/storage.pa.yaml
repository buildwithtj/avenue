              Text: |-
                =If(IsBlank(stoGal.Selected), "", "From " & stoGal.Selected.MemberId & " · " & stoGal.Selected.Status.Value & Char(10) & If(IsBlank(stoGal.Selected.Notes), "No notes from the member.", "Notes: " & stoGal.Selected.Notes) & If(IsBlank(stoGal.Selected.DecidedBy), "", Char(10) & "Decided by " & stoGal.Selected.DecidedBy & " · " & With({t: stoGal.Selected.DecidedAt}, If(IsBlank(t), "Time unavailable", With({u: DateAdd(t, TimeZoneOffset(t), TimeUnit.Minutes)}, With({m3: Date(Year(u), 3, 1), n11: Date(Year(u), 11, 1)}, Text(DateAdd(u, -If(u >= DateAdd(DateAdd(m3, Mod(8 - Weekday(m3), 7) + 7, TimeUnit.Days), 7, TimeUnit.Hours) && u < DateAdd(DateAdd(n11, Mod(8 - Weekday(n11), 7), TimeUnit.Days), 6, TimeUnit.Hours), 4, 5), TimeUnit.Hours), "d mmm yyyy")))))))
