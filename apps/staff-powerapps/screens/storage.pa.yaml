                =IfError(Patch(AvenueStorageCases, LookUp(AvenueStorageCases, CaseId = stoGal.Selected.CaseId), {Status: {Value: "Declined"}, Notes: Trim(Coalesce(stoGal.Selected.Notes, "") & Char(10) & "Declined: " & Trim(stoReason.Text)), DecidedBy: User().Email, DecidedAt: Now()}); Reset(stoReason); Notify("Declined.", NotificationType.Success), Notify("Could not save.", NotificationType.Error))
