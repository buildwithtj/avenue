                    Color: =RGBA(31,31,31,1)
                    FontWeight: =FontWeight.Bold
                    Size: =13
              - rqRowChip:
                  Control: Classic/Button
                  Properties:
                    Text: =Switch(ThisItem.Status.Value, "Pending", "Waiting", "Approved", "Approved", "Declined", "Declined", "Cancelled", "Cancelled", ThisItem.Status.Value)
                    X: =366
                    Y: =8
                    Width: =128
                    Height: =24
                    DisplayMode: =DisplayMode.Disabled
                    Fill: =Switch(ThisItem.Status.Value, "Pending", RGBA(244,235,211,1), "Approved", RGBA(220,232,235,1), "Declined", RGBA(243,227,227,1), RGBA(229,231,235,1))
                    DisabledFill: =Switch(ThisItem.Status.Value, "Pending", RGBA(244,235,211,1), "Approved", RGBA(220,232,235,1), "Declined", RGBA(243,227,227,1), RGBA(229,231,235,1))
                    DisabledColor: =Switch(ThisItem.Status.Value, "Pending", RGBA(107,79,16,1), "Approved", RGBA(15,76,92,1), "Declined", RGBA(155,44,44,1), RGBA(91,99,112,1))
                    Color: =Switch(ThisItem.Status.Value, "Pending", RGBA(107,79,16,1), "Approved", RGBA(15,76,92,1), "Declined", RGBA(155,44,44,1), RGBA(91,99,112,1))
                    BorderThickness: =0
                    Size: =10
                    FontWeight: =FontWeight.Bold
                    RadiusTopLeft: =12
                    RadiusTopRight: =12
                    RadiusBottomLeft: =12
                    RadiusBottomRight: =12
              - lblRowWhen:
                  Control: Label
                  Properties:
                    Text: |-
                      =With({s0: ThisItem.StartUtc}, If(IsBlank(s0), "Time unavailable", With({u: DateAdd(s0, TimeZoneOffset(s0), TimeUnit.Minutes)}, With({m3: Date(Year(u), 3, 1), n11: Date(Year(u), 11, 1)}, With({k: TimeZoneOffset(s0) - If(u >= DateAdd(DateAdd(m3, Mod(8 - Weekday(m3), 7) + 7, TimeUnit.Days), 7, TimeUnit.Hours) && u < DateAdd(DateAdd(n11, Mod(8 - Weekday(n11), 7), TimeUnit.Days), 6, TimeUnit.Hours), 4, 5) * 60}, Text(DateAdd(s0, k, TimeUnit.Minutes), "ddd d mmm") & " · " & Text(DateAdd(s0, k, TimeUnit.Minutes), "h:mm AM/PM") & "–" & Text(DateAdd(ThisItem.EndUtc, k, TimeUnit.Minutes), "h:mm AM/PM")))))) & " · " & ThisItem.Space.Value & If(ThisItem.Space.Value = "Dining", " · " & ThisItem.PeopleCount & " people", "")
                    X: =8
                    Y: =32
                    Width: =486
                    Height: =20
                    Color: =RGBA(31,31,31,1)
                    Size: =11
              - lblRowWin:
                  Control: Label
                  Properties:
                    Text: |-
                      =With({f: LookUp(AvenueFacilities, FacilityId = "flavors-hyattsville")}, With({s0: ThisItem.StartUtc}, If(IsBlank(s0), "Time unavailable", With({u: DateAdd(s0, TimeZoneOffset(s0), TimeUnit.Minutes)}, With({m3: Date(Year(u), 3, 1), n11: Date(Year(u), 11, 1)}, With({k: TimeZoneOffset(s0) - If(u >= DateAdd(DateAdd(m3, Mod(8 - Weekday(m3), 7) + 7, TimeUnit.Days), 7, TimeUnit.Hours) && u < DateAdd(DateAdd(n11, Mod(8 - Weekday(n11), 7), TimeUnit.Days), 6, TimeUnit.Hours), 4, 5) * 60}, "In from " & Text(DateAdd(s0, k - Coalesce(f.EarlyEntryMinutes, 0), TimeUnit.Minutes), "h:mm AM/PM") & " · Clean-up until " & Text(DateAdd(ThisItem.EndUtc, k + Coalesce(f.CleanupMinutes, 0), TimeUnit.Minutes), "h:mm AM/PM")))))))
                    X: =8
                    Y: =56
                    Width: =486
                    Height: =20
                    Color: =RGBA(91,99,112,1)
                    Size: =10
              - galQueueSep:
