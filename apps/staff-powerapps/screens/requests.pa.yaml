        - galQueue:
            Control: Gallery@2.15.0
            Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
            Properties:
              Items: =SortByColumns(Filter(AvenueBookings, Status.Value = "Pending"), "StartUtc", SortOrder.Ascending)
              X: =32
              Y: =52
              Width: =504
              Height: =604
              TemplateSize: =88
              Fill: =RGBA(0,0,0,0)
              BorderThickness: =0
              TemplateFill: =If(ThisItem.IsSelected, RGBA(241,243,228,1), RGBA(0,0,0,0))
            Children:
              - lblRowMember:
                  Control: Label
                  Properties:
                    Text: =Coalesce(LookUp(AvenueMembers, MemberId = ThisItem.MemberId).BusinessName, ThisItem.MemberId)
                    X: =8
