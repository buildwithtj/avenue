                    Y: =34
                    Width: =480
                    Height: =24
                    Color: =RGBA(91,99,112,1)
                    Size: =12
              - appItemPill:
                  Control: Classic/Button
                  Properties:
                    Text: =Switch(If(ThisItem.Stage.Value = "PaymentPending" && !IsBlank(ThisItem.ExpiresAt) && ThisItem.ExpiresAt < Now(), "Expired", ThisItem.Stage.Value), "PaymentPending", "Payment pending", "InviteNeeded", "Invite needed", If(ThisItem.Stage.Value = "PaymentPending" && !IsBlank(ThisItem.ExpiresAt) && ThisItem.ExpiresAt < Now(), "Expired", ThisItem.Stage.Value))
                    X: =496
                    Y: =20
                    Width: =128
                    Height: =24
                    DisplayMode: =DisplayMode.Disabled
