              - appItemTitle:
                  Control: Label
                  Properties:
                    Text: =Coalesce(ThisItem.BusinessName, "(no business name)") & " · " & Coalesce(ThisItem.ContactName, ThisItem.Email)
                    X: =8
                    Y: =4
                    Width: =480
                    Height: =28
                    Color: =RGBA(31,31,31,1)
                    FontWeight: =FontWeight.Semibold
              - appItemMeta:
