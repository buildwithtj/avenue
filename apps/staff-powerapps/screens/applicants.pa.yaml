            Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
            Properties:
              Items: |-
                =With({st: Coalesce(varAppStage, "All")}, SortByColumns(Filter(Filter(AvenueApplicants, FacilityId = "flavors-hyattsville"), st = "All" || (st = "Expired" && (Stage.Value = "Expired" || (Stage.Value = "PaymentPending" && !IsBlank(ExpiresAt) && ExpiresAt < Now()))) || (st <> "Expired" && Stage.Value = st && !(Stage.Value = "Expired" || (Stage.Value = "PaymentPending" && !IsBlank(ExpiresAt) && ExpiresAt < Now())))), "Created", SortOrder.Descending))
              X: =20
              Y: =90
              Width: =640
              Height: =580
              TemplateSize: =66
