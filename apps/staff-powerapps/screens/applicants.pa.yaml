        - appGal:
            Control: Gallery@2.15.0
            Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
            Properties:
              Items: |-
                =With({st: Coalesce(varAppStage, "All")}, SortByColumns(Filter(Filter(AvenueApplicants, FacilityId = "flavors-hyattsville"), st = "All" || (st = "Expired" && (Stage.Value = "Expired" || (Stage.Value = "PaymentPending" && !IsBlank(ExpiresAt) && ExpiresAt < Now()))) || (st <> "Expired" && Stage.Value = st && !(Stage.Value = "Expired" || (Stage.Value = "PaymentPending" && !IsBlank(ExpiresAt) && ExpiresAt < Now())))), "Created", SortOrder.Descending))
              X: =20
              Y: =90
              Width: =640
              Height: =580
              TemplateSize: =66
              Fill: =RGBA(0,0,0,0)
              BorderThickness: =0
              TemplateFill: =If(ThisItem.IsSelected, RGBA(241,243,228,1), RGBA(0,0,0,0))
            Children:
              - appItemTitle:
                  Control: Label
                  Properties:
                    Text: =Coalesce(ThisItem.BusinessName, "(no business name)") & " · " & Coalesce(ThisItem.ContactName, ThisItem.Email)
                    X: =8
                    Y: =4
                    Width: =480
                    Height: =28
                    Color: =RGBA(31,31,31,1)
                    FontWeight: =FontWeight.Semibold
              - appItemMeta:
                  Control: Label
                  Properties:
                    Text: =Coalesce(ThisItem.PlanId, "no plan") & " · day " & Coalesce(Text(ThisItem.CollectionDay), "-") & " · " & Coalesce(ThisItem.PayMethod.Value, "-") & If(IsBlank(ThisItem.PaidAt), " · not paid", " · paid " & Text(ThisItem.PaidAt, "d mmm yyyy"))
                    X: =8
                    Y: =34
                    Width: =480
                    Height: =24
                    Color: =RGBA(91,99,112,1)
                    Size: =12
              - appItemPill:
                  Control: Classic/Button
                  Properties:
                    Text: =Switch(If(ThisItem.Stage.Value = "PaymentPending" && !IsBlank(ThisItem.ExpiresAt) && ThisItem.ExpiresAt < Now(), "Expired", ThisItem.Stage.Value), "PaymentPending", "Payment pending", "InviteNeeded", "Invite needed", If(ThisItem.Stage.Value = "PaymentPending" && !IsBlank(ThisItem.ExpiresAt) && ThisItem.ExpiresAt < Now(), "Expired", ThisItem.Stage.Value))
                    X: =496
                    Y: =20
                    Width: =128
                    Height: =24
                    DisplayMode: =DisplayMode.Disabled
                    Fill: =Switch(If(ThisItem.Stage.Value = "PaymentPending" && !IsBlank(ThisItem.ExpiresAt) && ThisItem.ExpiresAt < Now(), "Expired", ThisItem.Stage.Value), "Active", RGBA(220,232,235,1), "Onboarding", RGBA(220,232,235,1), "InviteNeeded", RGBA(244,235,211,1), "Paid", RGBA(244,235,211,1), "PaymentPending", RGBA(229,231,235,1), RGBA(243,227,227,1))
