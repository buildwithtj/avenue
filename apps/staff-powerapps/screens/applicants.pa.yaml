                  Properties:
                    Text: =Coalesce(ThisItem.PlanId, "no plan") & " · day " & Coalesce(Text(ThisItem.CollectionDay), "-") & " · " & Coalesce(ThisItem.PayMethod.Value, "-") & If(IsBlank(ThisItem.PaidAt), " · not paid", " · paid " & Text(ThisItem.PaidAt, "d mmm yyyy"))
