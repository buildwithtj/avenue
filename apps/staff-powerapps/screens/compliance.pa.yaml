- tm_compliance:
    Control: Timer
    Properties:
      Duration: =420
      AutoStart: =true
      Repeat: =false
      Visible: =false
      X: =0
      Y: =28
      Width: =10
      Height: =10
- sc_compliance:
    Control: GroupContainer@1.3.0
    Variant: AutoLayout
    Properties:
      X: =0
      Y: =88
      Width: =App.Width
      Height: =App.Height - 88
      Fill: =RGBA(0, 0, 0, 0)
      PaddingTop: =Round((1 - Min(1, tm_compliance.Value / 420)) * 22, 0)
      LayoutAlignItems: =LayoutAlignItems.Center
      LayoutDirection: =LayoutDirection.Vertical
      LayoutOverflowY: =LayoutOverflow.Scroll
      DropShadow: =DropShadow.None
    Children:
    - pg_compliance:
        Control: GroupContainer@1.3.0
        Variant: ManualLayout
        Properties:
          Height: =696
          Width: =1366
          AlignInContainer: =AlignInContainer.Center
          FillPortions: =0
          Fill: =RGBA(0, 0, 0, 0)
          DropShadow: =DropShadow.None
        Children:
        - cTabDocs:
            Control: Classic/Button
            Properties:
              Text: ="Documents"
              X: =20
              Y: =0
              Width: =150
              Height: =36
              OnSelect: =Set(varCmpTab, "docs")
              Fill: =If(Coalesce(varCmpTab, "docs") = "docs", RGBA(15,76,92,1), RGBA(255,255,255,1))
              Color: =If(Coalesce(varCmpTab, "docs") = "docs", RGBA(244,245,247,1), RGBA(15,76,92,1))
              HoverFill: =If(Coalesce(varCmpTab, "docs") = "docs", RGBA(15,76,92,1), RGBA(244,245,247,1))
              HoverColor: =If(Coalesce(varCmpTab, "docs") = "docs", RGBA(244,245,247,1), RGBA(15,76,92,1))
              PressedFill: =RGBA(11,58,71,1)
              DisabledFill: =RGBA(225,228,233,1)
              DisabledColor: =RGBA(91,99,112,1)
              BorderThickness: =1
              Size: =13
              FontWeight: =FontWeight.Semibold
              RadiusTopLeft: =8
              RadiusTopRight: =8
              RadiusBottomLeft: =8
              RadiusBottomRight: =8
              BorderColor: =RGBA(15,76,92,1)
        - cTabCases:
            Control: Classic/Button
            Properties:
              Text: ="Cases (" & CountRows(Filter(AvenueComplianceCases, FacilityId = "flavors-hyattsville", Status.Value = "Open")) & " open)"
              X: =178
              Y: =0
              Width: =190
              Height: =36
              OnSelect: =Set(varCmpTab, "cases")
              Fill: =If(Coalesce(varCmpTab, "docs") = "cases", RGBA(15,76,92,1), RGBA(255,255,255,1))
              Color: =If(Coalesce(varCmpTab, "docs") = "cases", RGBA(244,245,247,1), RGBA(15,76,92,1))
              HoverFill: =If(Coalesce(varCmpTab, "docs") = "cases", RGBA(15,76,92,1), RGBA(244,245,247,1))
              HoverColor: =If(Coalesce(varCmpTab, "docs") = "cases", RGBA(244,245,247,1), RGBA(15,76,92,1))
              PressedFill: =RGBA(11,58,71,1)
              DisabledFill: =RGBA(225,228,233,1)
              DisabledColor: =RGBA(91,99,112,1)
              BorderThickness: =1
              Size: =13
              FontWeight: =FontWeight.Semibold
              RadiusTopLeft: =8
              RadiusTopRight: =8
              RadiusBottomLeft: =8
              RadiusBottomRight: =8
              BorderColor: =RGBA(15,76,92,1)
        - cTabOver:
            Control: Classic/Button
            Properties:
              Text: ="Owner overrides"
              X: =376
              Y: =0
              Width: =170
              Height: =36
              OnSelect: =Set(varCmpTab, "over")
              Fill: =If(Coalesce(varCmpTab, "docs") = "over", RGBA(15,76,92,1), RGBA(255,255,255,1))
              Color: =If(Coalesce(varCmpTab, "docs") = "over", RGBA(244,245,247,1), RGBA(15,76,92,1))
              HoverFill: =If(Coalesce(varCmpTab, "docs") = "over", RGBA(15,76,92,1), RGBA(244,245,247,1))
              HoverColor: =If(Coalesce(varCmpTab, "docs") = "over", RGBA(244,245,247,1), RGBA(15,76,92,1))
              PressedFill: =RGBA(11,58,71,1)
              DisabledFill: =RGBA(225,228,233,1)
              DisabledColor: =RGBA(91,99,112,1)
              BorderThickness: =1
              Size: =13
              FontWeight: =FontWeight.Semibold
              RadiusTopLeft: =8
              RadiusTopRight: =8
              RadiusBottomLeft: =8
              RadiusBottomRight: =8
              BorderColor: =RGBA(15,76,92,1)
        - cDocsHead:
            Control: Label
            Properties:
              Text: ="Member documents (expired first)"
              X: =20
              Y: =44
              Width: =640
              Height: =30
              Color: =RGBA(31,31,31,1)
              FontWeight: =FontWeight.Semibold
              Visible: =Coalesce(varCmpTab, "docs") = "docs"
        - cDocs:
            Control: Gallery@2.15.0
            Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
            Properties:
              Items: =SortByColumns(Filter(AvenueMemberDocuments, FacilityId = "flavors-hyattsville"), "ExpiryDate", SortOrder.Ascending)
              X: =20
              Y: =78
              Width: =640
              Height: =586
              TemplateSize: =70
              Fill: =RGBA(0,0,0,0)
              BorderThickness: =0
              TemplateFill: =If(ThisItem.IsSelected, RGBA(241,243,228,1), RGBA(0,0,0,0))
              Visible: =Coalesce(varCmpTab, "docs") = "docs"
            Children:
              - cDocTitle:
                  Control: Label
                  Properties:
                    Text: =ThisItem.DocType.Value & " · " & ThisItem.MemberId
                    X: =8
                    Y: =4
                    Width: =600
                    Height: =28
                    Color: =RGBA(31,31,31,1)
                    FontWeight: =FontWeight.Semibold
              - cDocMeta:
                  Control: Label
                  Properties:
                    Text: ="Expires " & Text(ThisItem.ExpiryDate, "d mmm yyyy") & " · " & If(IsBlank(ThisItem.SupersededBy), ThisItem.DocStatus.Value, "replaced by a newer upload") & If(ThisItem.Verified, " · verified", " · not verified")
                    X: =8
                    Y: =34
                    Width: =600
                    Height: =26
                    Color: =If(ThisItem.DocStatus.Value = "Expired" && IsBlank(ThisItem.SupersededBy), RGBA(164,38,44,1), RGBA(96,94,92,1))
                    Size: =12
              - cDocsSep:
                  Control: Label
                  Properties:
                    Text: =""
                    X: =8
                    Y: =69
                    Width: =608
                    Height: =1
                    Fill: =RGBA(225,228,233,1)
        - cSel:
            Control: Label
            Properties:
              Text: =If(IsBlank(cDocs.Selected), "Select a document", cDocs.Selected.DocType.Value & " for " & cDocs.Selected.MemberId)
              X: =690
              Y: =44
              Width: =640
              Height: =30
              Color: =RGBA(31,31,31,1)
              FontWeight: =FontWeight.Semibold
              Visible: =Coalesce(varCmpTab, "docs") = "docs"
        - cOpen:
            Control: Classic/Button
            Properties:
              Text: ="Open file"
              X: =690
              Y: =82
              Width: =180
              Height: =40
              OnSelect: =Launch(LookUp(AvenueDocumentFiles, SourceSubmissionId = cDocs.Selected.SourceSubmissionId).'Link to item')
              Fill: =RGBA(201,162,77,1)
              Color: =RGBA(31,31,31,1)
              HoverFill: =RGBA(179,141,60,1)
              HoverColor: =RGBA(31,31,31,1)
              PressedFill: =RGBA(179,141,60,1)
              DisabledFill: =RGBA(225,228,233,1)
              DisabledColor: =RGBA(91,99,112,1)
              BorderThickness: =0
              Size: =12
              FontWeight: =FontWeight.Semibold
              RadiusTopLeft: =8
              RadiusTopRight: =8
              RadiusBottomLeft: =8
              RadiusBottomRight: =8
              Visible: =(Coalesce(varCmpTab, "docs") = "docs") && !IsBlank(cDocs.Selected)
        - cVerify:
            Control: Classic/Button
            Properties:
              Text: ="Mark verified"
              X: =880
              Y: =82
              Width: =180
              Height: =40
              OnSelect: |-
                =Patch(AvenueMemberDocuments, cDocs.Selected, {Verified: true}); Notify("Marked as verified.", NotificationType.Success)
              Fill: =RGBA(201,162,77,1)
              Color: =RGBA(31,31,31,1)
              HoverFill: =RGBA(179,141,60,1)
              HoverColor: =RGBA(31,31,31,1)
              PressedFill: =RGBA(179,141,60,1)
              DisabledFill: =RGBA(225,228,233,1)
              DisabledColor: =RGBA(91,99,112,1)
              BorderThickness: =0
              Size: =12
              FontWeight: =FontWeight.Semibold
              RadiusTopLeft: =8
              RadiusTopRight: =8
              RadiusBottomLeft: =8
              RadiusBottomRight: =8
              Visible: =(Coalesce(varCmpTab, "docs") = "docs") && !IsBlank(cDocs.Selected) && !cDocs.Selected.Verified
        - cDocHelp:
            Control: Label
            Properties:
              Text: ="Something wrong with this document? Open the Cases tab to raise a case or place a booking hold on the member."
              X: =690
              Y: =132
              Width: =640
              Height: =40
              Color: =RGBA(96,94,92,1)
              Size: =11
              Visible: =Coalesce(varCmpTab, "docs") = "docs"
        - cCaseHead:
            Control: Label
            Properties:
              Text: ="Compliance cases (open first) · " & CountRows(Filter(AvenueComplianceCases, FacilityId = "flavors-hyattsville", Active = true)) & " booking hold(s) active"
              X: =20
              Y: =44
              Width: =640
              Height: =30
              Color: =RGBA(31,31,31,1)
              FontWeight: =FontWeight.Semibold
              Visible: =Coalesce(varCmpTab, "docs") = "cases"
        - cCases:
            Control: Gallery@2.15.0
            Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
            Properties:
              Items: =Sort(Filter(AvenueComplianceCases, FacilityId = "flavors-hyattsville"), If(Status.Value = "Open", 0, If(Status.Value = "Hold", 1, If(Status.Value = "More information", 2, 3))), SortOrder.Ascending)
              X: =20
              Y: =78
              Width: =640
              Height: =586
              TemplateSize: =70
              Fill: =RGBA(0,0,0,0)
              BorderThickness: =0
              TemplateFill: =If(ThisItem.IsSelected, RGBA(241,243,228,1), RGBA(0,0,0,0))
              Visible: =Coalesce(varCmpTab, "docs") = "cases"
            Children:
              - cCaseTitle:
                  Control: Label
                  Properties:
                    Text: =ThisItem.DocType.Value & " · " & ThisItem.MemberId
                    X: =8
                    Y: =4
                    Width: =600
                    Height: =28
                    Color: =RGBA(31,31,31,1)
                    FontWeight: =FontWeight.Semibold
              - cCaseMeta:
                  Control: Label
                  Properties:
                    Text: =ThisItem.Status.Value & If(ThisItem.Active, " · BOOKING HOLD", "") & " · " & Text(ThisItem.Created, "d mmm, h:mm AM/PM")
                    X: =8
                    Y: =34
                    Width: =600
                    Height: =26
                    Color: =If(ThisItem.Active, RGBA(164,38,44,1), If(ThisItem.Status.Value = "Open", RGBA(154,91,0,1), RGBA(96,94,92,1)))
                    Size: =12
              - cCasesSep:
                  Control: Label
                  Properties:
                    Text: =""
                    X: =8
                    Y: =69
                    Width: =608
                    Height: =1
                    Fill: =RGBA(225,228,233,1)
        - cCaseSel:
            Control: Label
            Properties:
              Text: =If(IsBlank(cCases.Selected), "Select a case", cCases.Selected.DocType.Value & " · " & cCases.Selected.MemberId & " · " & cCases.Selected.Status.Value)
              X: =690
              Y: =44
              Width: =640
              Height: =30
              Color: =RGBA(31,31,31,1)
              FontWeight: =FontWeight.Semibold
              Visible: =Coalesce(varCmpTab, "docs") = "cases"
        - cCaseWhy:
            Control: Label
            Properties:
              Text: |-
                =If(IsBlank(cCases.Selected), "", "Member said: " & cCases.Selected.Reason)
              X: =690
              Y: =78
              Width: =640
              Height: =56
              Color: =RGBA(96,94,92,1)
              Size: =12
              Visible: =Coalesce(varCmpTab, "docs") = "cases"
        - cCaseMsg:
            Control: Classic/TextInput
            Properties:
              Default: =""
              HintText: ="Message to the member (they see it on Home and Documents)"
              Mode: =TextMode.MultiLine
              X: =690
              Y: =140
              Width: =640
              Height: =70
              BorderColor: =RGBA(225,228,233,1)
