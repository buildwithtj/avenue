    Control: Timer
    Properties:
      Duration: =420
      AutoStart: =true
      Repeat: =false
      Visible: =false
      X: =0
      Y: =28
      Width: =10
      Height: =10
- sc_checkins:
    Control: GroupContainer@1.3.0
    Variant: AutoLayout
    Properties:
      X: =0
      Y: =88
      Width: =App.Width
      Height: =App.Height - 88
      Fill: =RGBA(0, 0, 0, 0)
      PaddingTop: =Round((1 - Min(1, tm_checkins.Value / 420)) * 22, 0)
      LayoutAlignItems: =LayoutAlignItems.Center
      LayoutDirection: =LayoutDirection.Vertical
      LayoutOverflowY: =LayoutOverflow.Scroll
      DropShadow: =DropShadow.None
    Children:
    - pg_checkins:
        Control: GroupContainer@1.3.0
        Variant: ManualLayout
        Properties:
          Height: =713
          Width: =1366
          AlignInContainer: =AlignInContainer.Center
          FillPortions: =0
          Fill: =RGBA(0, 0, 0, 0)
          DropShadow: =DropShadow.None
        Children:
        - kRecentHead:
            Control: Label
            Properties:
              Text: ="Recent checklists (failed in red)"
              X: =20
              Y: =0
              Width: =640
              Height: =30
              Color: =RGBA(31,31,31,1)
              FontWeight: =FontWeight.Semibold
        - kRecent:
            Control: Gallery@2.15.0
            Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
            Properties:
              Items: =SortByColumns(Filter(AvenueCheckIns, FacilityId = "flavors-hyattsville"), "SubmittedAt", SortOrder.Descending)
              X: =20
              Y: =35
              Width: =640
              Height: =330
              TemplateSize: =64
              Fill: =RGBA(0,0,0,0)
              BorderThickness: =0
              TemplateFill: =If(ThisItem.IsSelected, RGBA(241,243,228,1), RGBA(0,0,0,0))
            Children:
              - kRecTitle:
                  Control: Label
                  Properties:
                    Text: =ThisItem.Kind.Value & " · " & ThisItem.MemberId
                    X: =8
                    Y: =4
                    Width: =600
                    Height: =28
                    Color: =If(ThisItem.AllPassed, RGBA(36,36,36,1), RGBA(164,38,44,1))
                    FontWeight: =FontWeight.Semibold
              - kRecMeta:
                  Control: Label
                  Properties:
                    Text: =Text(ThisItem.SubmittedAt, "ddd d mmm, h:mm AM/PM") & " · booking " & ThisItem.BookingId & If(ThisItem.AllPassed, "", If(IsBlank(ThisItem.ResolvedAt), " · FAILED", " · failed, resolved"))
                    X: =8
                    Y: =32
                    Width: =600
                    Height: =24
                    Color: =RGBA(96,94,92,1)
                    Size: =12
              - kRecentSep:
                  Control: Label
                  Properties:
                    Text: =""
                    X: =8
                    Y: =63
                    Width: =608
                    Height: =1
                    Fill: =RGBA(225,228,233,1)
        - kAnsHead:
            Control: Label
            Properties:
              Text: =If(IsBlank(kRecent.Selected), "Select a checklist to see the answers", "Answers")
              X: =690
              Y: =0
              Width: =640
              Height: =30
              Color: =RGBA(31,31,31,1)
              FontWeight: =FontWeight.Semibold
        - kAnswers:
            Control: Label
            Properties:
              Text: =If(IsBlank(kRecent.Selected), "", IfError(Concat(Table(ParseJSON(kRecent.Selected.Answers)), Text(ThisRecord.Value.q) & "  →  " & Text(ThisRecord.Value.a), Char(10)), kRecent.Selected.Answers))
              X: =690
              Y: =35
              Width: =640
              Height: =150
              Color: =RGBA(31,31,31,1)
              VerticalAlign: =VerticalAlign.Top
        - kFailNote:
            Control: Classic/TextInput
            Properties:
              Default: =""
              HintText: ="Follow-up on this failed checklist (what was done)"
              X: =690
              Y: =190
              Width: =640
              Height: =46
              Mode: =TextMode.MultiLine
              Visible: =!IsBlank(kRecent.Selected) && !kRecent.Selected.AllPassed && IsBlank(kRecent.Selected.ResolvedAt)
              BorderColor: =RGBA(225,228,233,1)
              BorderThickness: =1
              Color: =RGBA(31,31,31,1)
              Fill: =RGBA(255,255,255,1)
        - kFailResolve:
            Control: Classic/Button
            Properties:
              Text: ="Log follow-up and resolve"
              X: =690
              Y: =242
              Width: =260
              Height: =34
              OnSelect: |-
                =Patch(AvenueCheckIns, kRecent.Selected, {ResolvedAt: Now(), ResolvedBy: User().Email, ResolutionNote: kFailNote.Text}); Reset(kFailNote); Refresh(AvenueCheckIns)
              Fill: =RGBA(201,162,77,1)
              Color: =RGBA(31,31,31,1)
              HoverFill: =RGBA(179,141,60,1)
              HoverColor: =RGBA(31,31,31,1)
              PressedFill: =RGBA(179,141,60,1)
              DisabledFill: =RGBA(225,228,233,1)
              DisabledColor: =RGBA(91,99,112,1)
              BorderThickness: =0
              Size: =12
              FontWeight: =FontWeight.Semibold
              RadiusTopLeft: =8
              RadiusTopRight: =8
              RadiusBottomLeft: =8
              RadiusBottomRight: =8
              DisplayMode: =If(IsBlank(Trim(kFailNote.Text)), DisplayMode.Disabled, DisplayMode.Edit)
              Visible: =!IsBlank(kRecent.Selected) && !kRecent.Selected.AllPassed && IsBlank(kRecent.Selected.ResolvedAt)
        - kFailDone:
            Control: Label
            Properties:
              Text: |-
                =If(!IsBlank(kRecent.Selected) && !kRecent.Selected.AllPassed && !IsBlank(kRecent.Selected.ResolvedAt), "Resolved by " & kRecent.Selected.ResolvedBy & " on " & Text(kRecent.Selected.ResolvedAt, "d mmm, h:mm AM/PM") & ": " & kRecent.Selected.ResolutionNote, "")
              X: =690
              Y: =190
              Width: =640
              Height: =80
              Color: =RGBA(96,94,92,1)
              Size: =12
        - kMissHead:
            Control: Label
            Properties:
              Text: |-
                ="Missed entry checklist: member reminded, staff to follow up"
              X: =690
              Y: =300
              Width: =640
              Height: =30
              Color: =RGBA(31,31,31,1)
              FontWeight: =FontWeight.Semibold
        - kMissed:
            Control: Gallery@2.15.0
            Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
            Properties:
              Items: =Filter(Filter(AvenueBookings, Status.Value = "Approved", StartUtc <= Now(), EndUtc >= DateAdd(Now(), -12, TimeUnit.Hours)) As b, !IsBlank(b.MissedCheckInAt) && IsBlank(b.OutreachAt) && IsBlank(LookUp(AvenueCheckIns, BookingId = b.BookingId && Kind.Value = "Entry")))
